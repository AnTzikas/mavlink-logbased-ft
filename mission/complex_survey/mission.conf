# =============================================================================
# mission.conf  --  survey mission configuration
#
# Format: the SAME flags as the command line, one or many per line.
#   '#' starts a comment.  Quotes are respected (shlex parsing).
# Loaded automatically when mission.py is run with NO command-line args:
#       python3 mission.py
# Override the path with $MISSION_CONFIG. Real CLI args override this file.
# =============================================================================


# ---------------------------------------------------------------------------
# CONNECTION & MISSION  (required)
# ---------------------------------------------------------------------------
--connection            udp:127.0.0.1:14551                                  # MAVLink connection string
--mission               /app/missions/complex_survey/mission.waypoints       # QGC .waypoints file to fly
--model-path            /app/missions/complex_survey/yolov8s.pt              # YOLO model


# ---------------------------------------------------------------------------
# DRONE DISCOVERY
# ---------------------------------------------------------------------------
--discovery-timeout-s   10        # max recv-attempt cap when listening for drones
--expected-drones       2         # stop discovery once this many are found.
                                  # IMPORTANT: set this (and keep it accurate) when
                                  # running under the wrapper -- it makes discovery
                                  # replay-deterministic. Use 1 for single-drone.


# ---------------------------------------------------------------------------
# ALTITUDES & SPEED
# ---------------------------------------------------------------------------
# --takeoff-alt-m       15        # optional override; if omitted, taken from the
                                  # waypoint file / mission default.
--cruise-alts           15,20     # per-drone cruise altitude in discovery order
                                  # (last value repeats if more drones). Keeps the
                                  # two drones vertically separated in transit.
--inspect-alt-m         10        # common altitude every drone descends to for nadir
--confirm-alt-m         5         # Stage-2 oblique confirmation altitude
--confirm-offset-m      5         # Stage-2 horizontal offset from the target
--airspeed-m-s          5         # cruise airspeed


# ---------------------------------------------------------------------------
# ARRIVAL / SETTLE TOLERANCES
# ---------------------------------------------------------------------------
--waypoint-tolerance-m  3.0       # arrival radius for goto/goto_home/goto_side
--takeoff-tolerance-m   1.0       # altitude tolerance for takeoff/descend/climb
--landing-tolerance-m   0.4       # altitude tolerance for landing
--settle-speed-m-s      0.4       # a move completes only when within tolerance AND
                                  # speed <= this -- the drone must STOP and level
                                  # out before the next command/capture (prevents
                                  # photos taken mid-deceleration while tilted).


# ---------------------------------------------------------------------------
# CAPTURE / GIMBAL
# ---------------------------------------------------------------------------
--capture-settle-s      2.0                 # cap on gimbal-settle wait before a capture
--gimbal-tol-deg        3.0                 # capture once gimbal pitch is within this many
                                            # degrees of commanded (arrival-based settle)
# --no-gimbal-feedback                      # uncomment to use the fixed timed wait instead
--capture-dir /mnt/checkpoints/captures     # local dir for downloaded photos (per-waypoint)
--camera-ack-timeout-s  20                  # max wait for the camera component's ACK
--capture-max-retries   3                   # on NACK/ack-timeout, re-request up to N times
                                            # (fresh request_id each time) before skipping.
                                            # 0 = original skip-on-failure behaviour.


# ---------------------------------------------------------------------------
# DETECTION THRESHOLDS
# ---------------------------------------------------------------------------
--anomaly-threshold     0.15      # Stage 1: min confidence to count as "something"
--confirm-threshold     0.6       # Stage 2: min confidence to count as confirmed


# ---------------------------------------------------------------------------
# INSPECTION MODE  (mutually exclusive -- enable at most ONE)
# ---------------------------------------------------------------------------
# --no-camera                     # flight only: no capture/detection/FTP
# --nadir-only                    # nadir photo + detect, but never the 4-side sweep


# ---------------------------------------------------------------------------
# HEALTH / TIMEOUTS
# ---------------------------------------------------------------------------
--heartbeat-timeout-s   10        # heartbeat staleness => drone failed
--no-progress-timeout-s 45        # no progress on a command => drone failed
--battery-threshold     20        # land to recharge below this battery %
--charge-delay-s        60        # simulated recharge delay


# ---------------------------------------------------------------------------
# LOOP / REPORTING
# ---------------------------------------------------------------------------
--poll-interval-s       0.5       # main-loop interval (only if loop sleep enabled)
--status-interval-s     5         # status print interval
# --summary-file        run.txt   # explicit summary path; if omitted, a timestamped
                                  # mission_summary_*.txt is written automatically.